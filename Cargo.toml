[package]
name = "rine"
version = "0.3.0"
edition = "2021"
authors = ["Rine Project Contributors"]
description = "Lightweight, modern Win64 API translation layer for Linux written in Rust"
license = "GPL-3.0-or-later"

[dependencies]
bitflags = "2.4"
thiserror = "1.0"
libc = "0.2"
eframe = "0.27"
rfd = "0.14"
image = { version = "0.24", default-features = false, features = ["png", "jpeg", "gif"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"


[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 16
panic = "abort"
