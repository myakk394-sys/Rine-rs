# Rine Default DXVK Configuration
# Reduces shader compilation stutter and improves frame pacing for Unity / Godot / Unreal titles.

# Limit shader compiler threads so they do not starve the game's render/main threads
dxvk.numCompilerThreads = 4

# Enable async / graphics pipeline library where supported by host Vulkan driver
dxvk.enableGraphicsPipelineLibrary = Auto

# Relaxed barriers and cached dynamic resources improve Unity/D3D11 frame throughput
d3d11.relaxedBarriers = True
d3d11.cachedDynamicResources = a

# Minimize input latency without forcing VSync (let the game control syncInterval)
dxgi.maxFrameLatency = 1
